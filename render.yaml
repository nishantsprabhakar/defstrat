services:
  - type: web
    name: defstrat-dashboard
    env: node
    plan: free
    buildCommand: ""
    startCommand: "node server.mjs"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
